# Render Blueprint for Feedwise (Docker + Neon Postgres, no Redis).
#
# Services:
#   feedwise-server -> server/Dockerfile (Express API, :5000 locally / $PORT on Render)
#                      runs `prisma migrate deploy` on start, health check at /health
#   feedwise-client -> client/Dockerfile (nginx SPA, same-origin /api proxied
#                      to BACKEND_URL via nginx template)
#
# Database: Neon Postgres (external). Paste the pooled Neon URL as DATABASE_URL
#   e.g. postgresql://user:pass@ep-xxx.neon.tech/feedwise?sslmode=require
#   (pooled 6543 URLs: append &pgbouncer=true&connection_limit=1; if migrations
#   fail through the pooler, use the direct 5432 URL for the first deploy).
#
# Redis: intentionally omitted. Leave REDIS_URL unset — the server falls back to
#   in-memory rate limiting + node-cron (see server/src/lib/redis.ts).
#
# Local dev is UNCHANGED: `docker compose up --build` still uses
#   docker-compose.yml (postgres:5434, redis:6379, Vite proxy). This file is only
#   used by Render Blueprints and never by compose.
#
# Setup:
#   1. Push this file, then Render Dashboard -> New -> Blueprint -> select repo.
#   2. Fill every `sync: false` prompt (see below).
#   3. Deploy server first, verify https://<server>.onrender.com/health.
#   4. Set client BACKEND_URL to https://<server>.onrender.com, deploy client.
#   5. Stripe Dashboard -> webhooks: https://<server>.onrender.com/api/payments/webhook

services:
  - type: web
    name: feedwise-server
    runtime: docker
    plan: starter # keep always-on for API + cron; free sleeps and breaks jobs
    region: oregon
    dockerfilePath: server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    numInstances: 1 # single instance: cron has no Redis distributed lock
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - server/**
        - shared/**
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      # NOTE: Render injects PORT automatically — do NOT set it here.
      - key: DATABASE_URL
        sync: false # Neon pooled URL (sslmode=require)
      - key: BETTER_AUTH_SECRET
        generateValue: true # 256-bit base64; satisfies >=32 char check
      - key: BETTER_AUTH_URL
        sync: false # https://feedwise-server.onrender.com
      - key: CLIENT_URL
        sync: false # https://feedwise-client.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.6-flash
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_BASIC_PRICE_ID
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false # e.g. https://s3.amazonaws.com or R2 endpoint
      - key: S3_FORCE_PATH_STYLE
        value: 'true'
      # Optional (omit to use code defaults): S3_PUBLIC_URL, S3_OBJECT_ACL,
      # REDIS_URL (empty = in-memory fallback), SMTP_* (empty = no-op mail),
      # EMAIL_FROM.

  - type: web
    name: feedwise-client
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: client/Dockerfile
    dockerContext: .
    healthCheckPath: /
    numInstances: 1
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - client/**
        - shared/**
        - render.yaml
    envVars:
      - key: BACKEND_URL
        sync: false # https://feedwise-server.onrender.com (no trailing slash)
      # NOTE: Render injects PORT automatically — nginx template listens on $PORT.
