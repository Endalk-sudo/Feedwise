# Local DEVELOPMENT stack with hot reload:
#   client  -> Vite dev (http://localhost:5173)
#   server  -> tsx watch (http://localhost:5000, /health)
#   postgres -> 16-alpine (host port 5434)
#   redis   -> 7-alpine (host port 6379) — powers BullMQ + rate limiting
#
# Usage:
#   cp server/example.env server/.env   # once, then fill secrets
#   docker compose up --build            # first run also deploys migrations
#
# Production: use Upstash Redis (REDIS_URL=rediss://...) instead of local redis.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: feedback_dev
      POSTGRES_DB: feedback
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d feedback']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    command: redis-server --appendonly yes

  server:
    build:
      context: .
      dockerfile: server/Dockerfile.dev
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      # Compose-network URLs win over server/.env
      - DATABASE_URL=postgresql://postgres:feedback_dev@postgres:5432/feedback?schema=public
      - REDIS_URL=redis://redis:6379
      - BETTER_AUTH_URL=http://localhost:5000
      - CLIENT_URL=http://localhost:5173
    volumes:
      - ./server/src:/app/server/src
      - ./server/prisma:/app/server/prisma
      - ./shared:/app/shared
      - server-node-modules:/app/server/node_modules
      - shared-node-modules:/app/shared/node_modules
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:5000/health']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  client:
    build:
      # Repo-root context so client/Dockerfile.dev can COPY shared/
      # (the "@aifc/contracts": "file:../shared" dependency).
      context: .
      dockerfile: client/Dockerfile.dev
    ports:
      - '5173:5173'
    depends_on:
      server:
        condition: service_healthy
    environment:
      # Empty => same-origin /api, proxied by Vite to the server container.
      - VITE_API_URL=
      - VITE_PROXY_TARGET=http://server:5000
    volumes:
      - ./client/src:/app/client/src
      - ./client/index.html:/app/client/index.html
      - ./client/vite.config.ts:/app/client/vite.config.ts
      - ./shared:/app/shared
      - client-node-modules:/app/client/node_modules
      - shared-node-modules:/app/shared/node_modules
    networks:
      - app-network

volumes:
  pgdata:
  redisdata:
  server-node-modules:
  client-node-modules:
  shared-node-modules:

networks:
  app-network:
    driver: bridge
