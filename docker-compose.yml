# Local DEVELOPMENT stack with hot reload:
#   client  -> Vite dev (http://localhost:5173)
#   server  -> tsx watch (http://localhost:5000, /health)
#   postgres -> 16-alpine (host port 5434; 5433 is taken by another project)
#
# Usage:
#   cp server/example.env server/.env   # once, then fill secrets
#   docker compose up --build            # first run also deploys migrations
#
# Production images (Dockerfile + nginx) are a Phase 4 concern.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: feedback_dev
      POSTGRES_DB: feedback
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d feedback']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      # Compose-network DB URL wins over server/.env (same credentials scheme).
      - DATABASE_URL=postgresql://postgres:feedback_dev@postgres:5432/feedback?schema=public
      - BETTER_AUTH_URL=http://localhost:5000
      - CLIENT_URL=http://localhost:5173
    volumes:
      - ./server/src:/app/src
      - ./server/prisma:/app/prisma
      - server-node-modules:/app/node_modules
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:5000/health']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - '5173:5173'
    depends_on:
      server:
        condition: service_healthy
    environment:
      # Empty => same-origin /api, proxied by Vite to the server container.
      - VITE_API_URL=
      - VITE_PROXY_TARGET=http://server:5000
    volumes:
      - ./client/src:/app/src
      - ./client/index.html:/app/index.html
      - ./client/vite.config.ts:/app/vite.config.ts
      - client-node-modules:/app/node_modules
    networks:
      - app-network

volumes:
  pgdata:
  server-node-modules:
  client-node-modules:

networks:
  app-network:
    driver: bridge
