name: CI

on:
  push:
    branches: [main, develop, stack-upgrade]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install client dependencies
        working-directory: ./client
        # --legacy-peer-deps: npm arborist crashes on this graph (better-auth peerOptional vitest range)
        run: npm ci --legacy-peer-deps

      - name: Install server dependencies
        working-directory: ./server
        # --legacy-peer-deps: npm arborist crashes on this graph (better-auth peerOptional vitest range)
        run: npm ci --legacy-peer-deps

      - name: Run client lint
        working-directory: ./client
        run: npm run lint

      - name: Run server lint
        working-directory: ./server
        run: npm run lint

      - name: Check client formatting
        working-directory: ./client
        run: npm run format:check

      - name: Check server formatting
        working-directory: ./server
        run: npm run format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install client dependencies
        working-directory: ./client
        # --legacy-peer-deps: npm arborist crashes on this graph (better-auth peerOptional vitest range)
        run: npm ci --legacy-peer-deps

      - name: Install server dependencies
        working-directory: ./server
        # --legacy-peer-deps: npm arborist crashes on this graph (better-auth peerOptional vitest range)
        run: npm ci --legacy-peer-deps

      - name: Run client type check
        working-directory: ./client
        run: npm run typecheck

      - name: Run server type check
        working-directory: ./server
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: feedback_test
          POSTGRES_DB: feedback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d feedback_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:feedback_test@localhost:5432/feedback_test?schema=public
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install client dependencies
        working-directory: ./client
        # --legacy-peer-deps: npm arborist crashes on this graph (better-auth peerOptional vitest range)
        run: npm ci --legacy-peer-deps

      - name: Install server dependencies
        working-directory: ./server
        # --legacy-peer-deps: npm arborist crashes on this graph (better-auth peerOptional vitest range)
        run: npm ci --legacy-peer-deps

      - name: Run client tests
        working-directory: ./client
        run: npm run test

      - name: Run server tests
        working-directory: ./server
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install client dependencies
        working-directory: ./client
        # --legacy-peer-deps: npm arborist crashes on this graph (better-auth peerOptional vitest range)
        run: npm ci --legacy-peer-deps

      - name: Install server dependencies
        working-directory: ./server
        # --legacy-peer-deps: npm arborist crashes on this graph (better-auth peerOptional vitest range)
        run: npm ci --legacy-peer-deps

      - name: Build client
        working-directory: ./client
        run: npm run build

      - name: Build server
        working-directory: ./server
        run: npm run build

      - name: Upload client build
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist

      - name: Upload server build
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: server/dist
