# PRODUCTION stack (built images, no bind mounts):
#   client  -> nginx serving vite build (http://localhost:3000, /api proxied)
#   server  -> node dist (http://localhost:5000, migrate deploy on start)
#   postgres -> 16-alpine (host port 5434)
#
# Usage:
#   cp server/example.env server/.env   # once, with production secrets/URLs
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Local development uses docker-compose.yml (hot reload) instead.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feedback_prod}
      POSTGRES_DB: feedback
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d feedback']
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      # Repo-root context so server/Dockerfile can COPY shared/
      # (the "@aifc/contracts": "file:../shared" dependency).
      context: .
      dockerfile: server/Dockerfile
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-feedback_prod}@postgres:5432/feedback?schema=public
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:5000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  client:
    build:
      # Repo-root context so client/Dockerfile can COPY shared/
      # (the "@aifc/contracts": "file:../shared" dependency).
      context: .
      dockerfile: client/Dockerfile
    ports:
      - '3000:80'
    depends_on:
      server:
        condition: service_healthy
    networks:
      - app-network

volumes:
  pgdata-prod:

networks:
  app-network:
    driver: bridge
